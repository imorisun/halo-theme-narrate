apiVersion: v1alpha1
kind: Setting
metadata:
  name: narrate-setting
spec:
  forms:
    - group: brand
      label: 品牌与首屏
      formSchema:
        - $formkit: text
          name: site_slogan
          label: 站点标语
          help: 首页首屏、关于页与友链页的简介文案；留空时读取 Halo「基本设置」中的站点副标题。
          value: ""
        - $formkit: text
          name: brand_en_slogan
          label: 站点英文标语
          help: 页头与页脚站点名称下方的英文小字；留空时显示 SERENE。
          value: "SERENE"
        - $formkit: text
          name: hero_glyph
          label: 首屏背景大字
          help: 首页首屏背景的巨幅描边字符，页脚品牌区沿用同一字符；留空时显示「叙」。
          value: "叙"
        - $formkit: text
          name: hero_kicker
          label: 首屏眉题
          help: 首页首屏主张句上方的短标签；留空时显示「叙 · 个人博客」。
          value: "叙 · 个人博客"
        - $formkit: text
          name: footer_tagline
          label: 页脚站点标语
          help: 页脚站点名称下方的一行文字；留空时显示「Narrate · 以文为名」。
          value: "Narrate · 以文为名"
        - $formkit: switch
          name: enable_web_font
          label: 启用内置中文字体
          help: 本地加载随主题分发的 LXGW 975 圆体（OFL-1.1），不请求第三方服务；关闭后回退系统字体，不影响正常阅读。
          value: true
        - $formkit: text
          name: hero_statement
          label: 首屏主张句
          help: 首页首屏的主句，使用 {rot} 标记轮播词的位置，例如：在喧嚣里，留一处{rot}。
          value: "在喧嚣里，留一处{rot}。"
        - $formkit: textarea
          name: hero_rot_words
          label: 首屏轮播词
          help: 替换主张句中 {rot} 的词组，每行一条，按行依次轮播。
          value: |-
            笔墨栖居地
            思想避风港
            文字小天地
            心灵自留地

    - group: home
      label: 首页模块
      formSchema:
        - $formkit: switch
          name: enable_moments
          label: 启用瞬间
          help: 数据来自「瞬间」插件，需先安装并启用；关闭后首页不显示瞬间区块。
          value: true
        - $formkit: number
          name: moment_limit
          label: 瞬间展示数量
          help: 首页瞬间区块最多展示的条数。
          value: 6
          min: 1
          max: 20
        - $formkit: categorySelect
          name: categories
          label: 分类导览展示的分类
          help: 选择首页分类导览要展示的分类；留空时隐藏整个分类导览。
          multiple: true
          value: []
        - $formkit: textarea
          name: greetings
          label: 问候语
          help: 每行一条，按顺序对应 05:00–11:00、11:00–13:00、13:00–18:00、18:00–23:00、23:00–次日 05:00 五个时段；不足五条时以最后一条补齐。
          value: |-
            早安，新的一天。
            午安，记得好好吃饭。
            下午好，慢慢来。
            夜色温柔，适合写字。
            夜深了，写点什么吧。

    - group: post
      label: 文章与阅读
      formSchema:
        - $formkit: switch
          name: show_toc
          label: 显示文章目录
          help: 正文包含二级或三级标题时，自动在右侧生成文章目录；无标题时正文自动收窄居中。
          value: true
        - $formkit: switch
          name: show_views
          label: 显示阅读量
          help: 在文章头部显示阅读量，数据来自 Halo 内置的访问统计。
          value: true
        - $formkit: text
          name: license_name
          label: 版权协议名称
          help: 文章底部版权说明展示的协议名称，例如 CC BY-NC-SA 4.0。
          value: "CC BY-NC-SA 4.0"
        - $formkit: text
          name: license_url
          label: 版权协议链接
          help: 点击协议名称时跳转的地址。
          value: "https://creativecommons.org/licenses/by-nc-sa/4.0/"

    - group: links
      label: 页脚与备案
      formSchema:
        - $formkit: number
          name: footer_links_limit
          label: 页脚友链展示数量
          help: 页脚随机展示的友链数量；需安装并启用「链接管理」插件后生效。
          value: 8
          min: 1
          max: 20
        - $formkit: array
          name: beian_links
          label: 备案信息链接
          help: 页脚展示的备案信息，每项包含显示文本与跳转链接，例如 ICP 备案、公安备案；为空时不展示。
          addLabel: 添加链接
          emptyText: 暂无备案链接，点击「添加链接」新增
          max: 5
          itemLabels:
            - type: text
              label: $value.text
          value: []
          children:
            - $formkit: text
              name: text
              label: 显示文本
              value: ""
            - $formkit: text
              name: url
              label: 跳转链接
              help: 备案查询地址，需以 https:// 开头。
              value: ""
