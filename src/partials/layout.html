<!doctype html>
<html
  lang="zh-CN"
  xmlns:th="http://www.thymeleaf.org"
  th:with="menu=${menuFinder.getPrimary()},
           brandEnSlogan=${#strings.isEmpty(theme.config.brand?.brand_en_slogan) ? 'SERENE' : theme.config.brand.brand_en_slogan},
           brandGlyph=${#strings.isEmpty(theme.config.brand?.hero_glyph) ? '叙' : theme.config.brand.hero_glyph},
           footerTagline=${#strings.isEmpty(theme.config.brand?.footer_tagline) ? 'Narrate · 以文为名' : theme.config.brand.footer_tagline}"
  th:attr="data-moments-url=@{/moments}"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfbfa" />
    <!-- 自托管中文字体：LXGW 975 圆体（OFL-1.1），随主题分发，不请求第三方服务 -->
    <link
      rel="stylesheet"
      th:if="${theme.config.brand?.enable_web_font != false}"
      th:href="@{/assets/fonts/lxgw.css}"
    />
    <script>
      (function () {
        // 渐进增强标记：仅在 JS 可用时才允许 CSS 隐藏待浮现内容
        document.documentElement.classList.add("js");
        // 模块脚本加载失败时撤销标记，确保内容仍然可见
        window.addEventListener(
          "error",
          function (event) {
            if (event.target && event.target.tagName === "SCRIPT") {
              document.documentElement.classList.remove("js");
            }
          },
          true,
        );
        var saved = null;
        try {
          saved = localStorage.getItem("narrate-theme");
        } catch {
          saved = null;
        }
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        // 同步给 Halo 插件组件（评论 / 搜索等），其内置暗色方案依赖该属性
        document.documentElement.setAttribute("data-color-scheme", dark ? "dark" : "light");
        // 移动端地址栏颜色跟随主题
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", dark ? "#121316" : "#fbfbfa");
        }
      })();
    </script>
    <slot name="head"></slot>
    <script type="module" src="./js/main.ts"></script>
  </head>

  <body th:class="|tpl-${_templateId ?: 'page'}|">
    <div class="read-progress" id="readProgress" aria-hidden="true"></div>

    <header class="site-header">
      <div class="site-header__inner container">
        <a class="brand" th:href="@{/}" th:aria-label="${site.title}">
          <img
            class="brand__logo"
            th:if="${not #strings.isEmpty(site.logo)}"
            th:src="${site.logo}"
            th:alt="${site.title}"
            width="30"
            height="30"
            decoding="async"
          />
          <span class="brand__name">
            <span th:text="${site.title}">Narrate</span>
            <small th:text="${brandEnSlogan}">SERENE</small>
          </span>
        </a>

        <nav class="nav" id="nav" aria-label="主导航">
          <!-- 菜单项为树结构：子菜单通过 MenuItemVo.children 获取，不能读取已弃用的 spec.children -->
          <ul class="nav__list" th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}">
            <li
              class="nav__item"
              th:each="item : ${menu.menuItems}"
              th:with="inert=${#strings.isEmpty(item.status.href) or item.status.href == '/'}"
              th:classappend="${not #lists.isEmpty(item.children)} ? 'nav__item--has-children' : ''"
            >
              <!-- 指向首页（或无链接）的菜单仅作分组标签：不加 href、不可点击、不参与激活态 -->
              <a
                class="nav__link"
                th:attr="href=${inert ? null : item.status.href},aria-disabled=${inert} ? 'true' : null"
                th:target="${item.spec.target?.value ?: '_self'}"
                th:classappend="${inert} ? 'is-inert' : ''"
              >
                <span class="nav__text" th:text="${item.status.displayName}"></span>
              </a>
              <button
                th:if="${not #lists.isEmpty(item.children)}"
                class="menu-expand"
                type="button"
                aria-expanded="false"
                th:attr="aria-label=${item.status.displayName + ' 子菜单'}"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </button>
              <th:block th:replace="~{::subTree(items=${item.children})}"></th:block>
            </li>
          </ul>
          <!-- 固定文案：未配置 Halo 菜单时的默认导航 -->
          <th:block th:if="${menu == null or #lists.isEmpty(menu.menuItems)}">
            <a th:href="@{/}" th:text="'首页'"></a>
            <a th:href="@{${site.routes.archivesUri}}" th:text="'归档'"></a>
            <a th:href="@{/categories}" th:text="'分类'"></a>
            <a th:href="@{/tags}" th:text="'标签'"></a>
          </th:block>
        </nav>

        <div class="header-actions">
          <button
            th:if="${pluginFinder.available('PluginSearchWidget')}"
            class="icon-btn"
            id="searchBtn"
            type="button"
            aria-label="搜索"
            title="搜索（Ctrl / ⌘ + K）"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="themeBtn"
            type="button"
            aria-label="切换深浅色"
            title="切换深浅色"
          >
            <svg
              class="i-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4.2" />
              <path
                d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"
              />
            </svg>
            <svg
              class="i-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          </button>
          <button
            class="icon-btn nav-toggle"
            id="navToggle"
            type="button"
            aria-label="菜单"
            aria-expanded="false"
            aria-controls="nav"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Swup 内容容器：页头、页脚保持常驻，仅替换 main 内部内容 -->
    <main id="swup" class="transition-main">
      <slot></slot>
    </main>

    <footer class="site-footer">
      <div class="footer-grid container">
        <div class="footer-col footer-col--brand">
          <a class="footer-brand" th:href="@{/}">
            <span class="footer-brand__glyph" th:text="${brandGlyph}">叙</span>
            <span class="footer-brand__name">
              <span th:text="${site.title}">Narrate</span>
              <small th:text="${brandEnSlogan}">SERENE</small>
            </span>
          </a>
          <p th:text="${footerTagline}">Narrate · 以文为名</p>
        </div>

        <div class="footer-col">
          <h3 class="footer-col__title" th:text="'导航'">导航</h3>
          <ul class="footer-links footer-links--nav">
            <li
              th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}"
              th:each="item : ${menu.menuItems}"
              th:with="inert=${#strings.isEmpty(item.status.href) or item.status.href == '/'}"
            >
              <a
                th:attr="href=${inert ? null : item.status.href},aria-disabled=${inert} ? 'true' : null"
                th:classappend="${inert} ? 'is-inert' : ''"
                th:text="${item.status.displayName}"
              ></a>
              <!-- 菜单较多时折叠子菜单，保持页脚紧凑 -->
              <button
                th:if="${not #lists.isEmpty(item.children)}"
                class="menu-expand menu-expand--footer"
                type="button"
                aria-expanded="false"
                th:attr="aria-label=${item.status.displayName + ' 子菜单'}"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </button>
              <th:block th:replace="~{::footerTree(items=${item.children})}"></th:block>
            </li>
            <!-- 固定文案：默认页脚导航 -->
            <th:block th:if="${menu == null or #lists.isEmpty(menu.menuItems)}">
              <li><a th:href="@{/}" th:text="'首页'"></a></li>
              <li><a th:href="@{${site.routes.archivesUri}}" th:text="'归档'"></a></li>
              <li><a th:href="@{/tags}" th:text="'标签'"></a></li>
            </th:block>
          </ul>
        </div>

        <th:block th:with="footerCategories=${categoryFinder.listAll()}">
          <div class="footer-col" th:if="${not #lists.isEmpty(footerCategories)}">
            <h3 class="footer-col__title" th:text="'分类'">分类</h3>
            <ul class="footer-links">
              <li th:each="cat : ${footerCategories}">
                <a th:href="@{${cat.status.permalink}}" th:text="${cat.spec.displayName}"></a>
              </li>
            </ul>
          </div>
        </th:block>

        <!-- 友链：来自「链接管理」插件，随机展示数量由主题设置控制；未安装插件时不展示该列 -->
        <div class="footer-col" th:if="${pluginFinder.available('PluginLinks')}">
          <h3 class="footer-col__title" th:text="'友链'">友链</h3>
          <ul class="footer-links footer-links--friends">
            <li th:each="link : ${linkFinder.random(theme.config.links?.footer_links_limit ?: 8)}">
              <a
                th:href="${link.spec.url}"
                th:text="${link.spec.displayName}"
                th:title="${link.spec.displayName}"
                target="_blank"
                rel="noopener noreferrer"
              ></a>
            </li>
          </ul>
        </div>
      </div>

      <!-- 底部信息统一由「备案信息链接」组件渲染：版权声明、驱动信息与备案链接 -->
      <div class="footer-bottom container">
        <div class="footer-beian">
          <div class="footer-beian__left">
            <span class="footer-beian__copy">
              © <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span>
              <a th:href="@{/}" th:text="${site.title}"></a>
            </span>
            <!-- 固定文案：页脚驱动信息（不提供自定义配置） -->
            <span class="footer-beian__powered">Powered by Halo · Theme Narrate · 叙</span>
          </div>
          <!-- 备案信息链接由主题设置「底部」模块的备案链接数组提供，每项含显示文本与跳转链接 -->
          <div class="footer-beian__links">
            <a
              th:each="link : ${theme.config.links?.beian_links}"
              th:if="${not #strings.isEmpty(link.text) and not #strings.isEmpty(link.url)}"
              th:href="${link.url}"
              th:text="${link.text}"
              target="_blank"
              rel="noopener noreferrer"
            ></a>
          </div>
        </div>
      </div>
    </footer>

    <button class="to-top" id="toTop" type="button" aria-label="返回顶部">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m6 14 6-6 6 6" />
      </svg>
    </button>

    <!--
      菜单递归片段：按 Halo 菜单项的树结构逐层渲染，支持任意层级子菜单。
      · 定义处包在 th:if="${false}" 中，不在页面当前位置输出；
      · 仅在 th:replace 引用时渲染，片段自身的 th:if 保证空子集不产生空列表；
      · 片段定义随 layout 内联到各页面模板，因此用 ~{::片段名} 引用当前模板即可递归。
    -->
    <th:block th:if="${false}">
      <ul class="nav__submenu" th:fragment="subTree(items)" th:if="${not #lists.isEmpty(items)}">
        <li
          class="nav__item"
          th:each="item : ${items}"
          th:with="inert=${#strings.isEmpty(item.status.href) or item.status.href == '/'}"
          th:classappend="${not #lists.isEmpty(item.children)} ? 'nav__item--has-children' : ''"
        >
          <a
            class="nav__sublink"
            th:attr="href=${inert ? null : item.status.href},aria-disabled=${inert} ? 'true' : null"
            th:text="${item.status.displayName}"
            th:target="${item.spec.target?.value ?: '_self'}"
            th:classappend="${inert} ? 'is-inert' : ''"
          ></a>
          <button
            th:if="${not #lists.isEmpty(item.children)}"
            class="menu-expand"
            type="button"
            aria-expanded="false"
            th:attr="aria-label=${item.status.displayName + ' 子菜单'}"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <th:block th:replace="~{::subTree(items=${item.children})}"></th:block>
        </li>
      </ul>

      <ul
        class="footer-sublinks"
        th:fragment="footerTree(items)"
        th:if="${not #lists.isEmpty(items)}"
      >
        <li
          th:each="item : ${items}"
          th:with="inert=${#strings.isEmpty(item.status.href) or item.status.href == '/'}"
        >
          <a
            th:attr="href=${inert ? null : item.status.href},aria-disabled=${inert} ? 'true' : null"
            th:classappend="${inert} ? 'is-inert' : ''"
            th:text="${item.status.displayName}"
          ></a>
          <button
            th:if="${not #lists.isEmpty(item.children)}"
            class="menu-expand menu-expand--footer"
            type="button"
            aria-expanded="false"
            th:attr="aria-label=${item.status.displayName + ' 子菜单'}"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <th:block th:replace="~{::footerTree(items=${item.children})}"></th:block>
        </li>
      </ul>
    </th:block>

    <halo:footer />
  </body>
</html>
