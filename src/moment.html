<!--
  瞬间详情页（plugin-moments 的 /moments/{name} 路由，模板名 moment.html）

  可用变量：
    moment — MomentVo，包含 metadata / spec.content / spec.releaseTime / spec.tags / owner / stats
  插件未安装时该模板不会被渲染，因此无需额外判断插件是否可用。
-->
<include src="layout.html">
  <template name="head">
    <title th:text="|瞬间 · ${site.title}|">瞬间 · Narrate</title>
  </template>

  <div class="page-wrap container">
    <article
      class="moment-detail"
      th:if="${moment != null}"
      th:with="content=${moment.spec.content}"
    >
      <header class="moment-detail__head">
        <!-- 头像与昵称同为作者页入口 -->
        <a
          class="moment-detail__avatar-link"
          th:href="@{/authors/{name}(name=${moment.owner.name})}"
        >
          <img
            class="moment-detail__avatar"
            th:if="${moment.owner != null and not #strings.isEmpty(moment.owner.avatar)}"
            th:src="${moment.owner.avatar}"
            th:alt="${moment.owner.displayName}"
          />
          <img
            class="moment-detail__avatar"
            th:unless="${moment.owner != null and not #strings.isEmpty(moment.owner.avatar)}"
            th:src="@{/assets/images/avatar.jpg}"
            th:alt="${site.title}"
          />
        </a>
        <div class="moment-detail__meta">
          <a
            class="moment-detail__author"
            th:href="@{/authors/{name}(name=${moment.owner.name})}"
            th:text="${moment.owner?.displayName ?: site.title}"
            >作者</a
          >
          <time
            class="moment-detail__time"
            th:datetime="${moment.spec.releaseTime ?: moment.metadata.creationTimestamp}"
            data-relative
            th:text="${#temporals.format(moment.spec.releaseTime ?: moment.metadata.creationTimestamp, 'yyyy.MM.dd HH:mm')}"
            >2026.01.01 00:00</time
          >
        </div>
      </header>

      <div
        class="moment-detail__body post-content"
        th:if="${not #strings.isEmpty(content.html)}"
        th:utext="${content.html}"
      ></div>

      <div class="moment-detail__media" th:if="${not #lists.isEmpty(content.medium)}">
        <th:block th:each="item : ${content.medium}">
          <a
            class="moment-detail__photo"
            th:if="${item.type.name == 'PHOTO'}"
            th:href="${item.url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img th:src="${item.url}" alt="瞬间" loading="lazy" decoding="async" />
          </a>
          <div class="moment-detail__video" th:if="${item.type.name == 'VIDEO'}">
            <video th:src="${item.url}" controls preload="metadata"></video>
          </div>
          <div class="moment-detail__audio" th:if="${item.type.name == 'AUDIO'}">
            <audio th:src="${item.url}" controls></audio>
          </div>
          <a
            class="moment-detail__attachment"
            th:if="${item.type.name == 'POST'}"
            th:href="${item.url}"
            target="_blank"
            rel="noopener noreferrer"
            th:text="'查看关联内容 →'"
            >查看关联内容 →</a
          >
        </th:block>
      </div>

      <footer class="moment-detail__foot">
        <div class="moment-detail__actions">
          <button
            class="moment-action moment-action--upvote"
            type="button"
            th:attr="data-moment-upvote=${moment.metadata.name}"
            aria-label="点赞"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 20.4 4.6 13a4.6 4.6 0 0 1 6.5-6.5l.9.9.9-.9A4.6 4.6 0 0 1 19.4 13Z" />
            </svg>
            <span
              class="moment-action__count"
              data-moment-upvote-count
              th:text="${moment.stats?.upvote ?: 0}"
              >0</span
            >
          </button>
          <a
            class="moment-action"
            th:if="${haloCommentEnabled}"
            href="#moment-comments"
            aria-label="查看评论"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.4-.6L3 21l1.7-4.4A8.4 8.4 0 1 1 21 11.5Z"
              />
            </svg>
            <span class="moment-action__count" th:text="${moment.stats?.approvedComment ?: 0}"
              >0</span
            >
          </a>
        </div>
        <a class="moment-detail__back" th:href="@{/moments}">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M11 18l-6-6 6-6" />
          </svg>
          <span th:text="'全部瞬间'">全部瞬间</span>
        </a>
      </footer>
    </article>

    <!-- 评论：由 Halo 评论组件渲染，关闭站点评论时隐藏 -->
    <section class="comments moment-comments" id="moment-comments" th:if="${haloCommentEnabled}">
      <div class="comments__head">
        <div class="comments__head-text">
          <span class="comments__no">Ⅲ</span>
          <h2 class="comments__title" th:text="'评论'">评论</h2>
          <span class="comments__en" th:text="'Comments'">Comments</span>
          <span class="comments__no" th:text="|${moment.stats?.approvedComment ?: 0} 条|"
            >0 条</span
          >
        </div>
        <span class="line"></span>
      </div>
      <halo:comment group="moment.halo.run" kind="Moment" th:attr="name=${moment.metadata.name}" />
    </section>
    <div class="comments-disabled" th:if="${!haloCommentEnabled}">评论已关闭</div>
  </div>
</include>
