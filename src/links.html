<include src="layout.html">
  <template name="head">
    <title th:text="|以站会友 · ${site.title}|">友链 · Narrate</title>
  </template>

  <section class="page-hero">
    <span class="page-hero__glyph" th:text="'友'">友</span>
    <div class="container">
      <div class="page-hero__kicker">BLOGROLL · 友情链接</div>
      <h1 class="page-hero__title">以站会友</h1>
      <p class="page-hero__sub">
        网络时代的君子之交。下面这些站点常年更新、各自生长，是我在互联网上反复回访的地方。
      </p>
    </div>
  </section>

  <div class="page-wrap container">
    <div class="link-stats">
      <span><b th:text="${#lists.size(links)}">0</b> 个站点</span>
      <i th:if="${not #lists.isEmpty(simpleGroups)}"></i>
      <div class="links_sort_menu" th:if="${not #lists.isEmpty(simpleGroups)}">
        <button type="button" class="active" data-filter="all" th:text="'全部'">全部</button>
        <button
          type="button"
          th:each="item : ${simpleGroups}"
          th:attr="data-filter=${item.metadata.name}"
          th:text="${item.spec.displayName}"
        ></button>
      </div>
    </div>

    <div class="link-grid" th:if="${not #lists.isEmpty(links)}">
      <a
        class="link-card reveal"
        th:each="link : ${links}"
        th:href="${link.spec.url}"
        target="_blank"
        rel="noopener noreferrer"
        th:attr="data-name=${link.spec.displayName},data-group=${link.spec.groupName ?: ''}"
      >
        <span class="link-card__index" aria-hidden="true"></span>
        <span class="link-card__arrow" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M7 17 17 7M8 7h9v9" />
          </svg>
        </span>
        <div class="link-card__head">
          <img
            class="link-card__avatar"
            th:if="${not #strings.isEmpty(link.spec.logo)}"
            th:src="${link.spec.logo}"
            th:alt="${link.spec.displayName}"
            loading="lazy"
          />
          <span
            class="link-card__avatar"
            th:if="${#strings.isEmpty(link.spec.logo)}"
            th:text="${#strings.substring(link.spec.displayName, 0, 1)}"
          ></span>
          <div class="link-card__intro">
            <p class="link-card__name" th:text="${link.spec.displayName}">站点</p>
            <p class="link-card__host"><i></i><span class="js-host"></span></p>
          </div>
        </div>
        <p
          class="link-card__desc"
          th:if="${not #strings.isEmpty(link.spec.description)}"
          th:text="${link.spec.description}"
        ></p>
      </a>
    </div>

    <div class="ff-empty" th:if="${#lists.isEmpty(links)}">
      <b>还没有友链</b>
      在 Halo Console 的「链接管理」中添加链接后，这里会自动展示。
    </div>

    <section class="link-apply reveal">
      <header class="link-apply__head">
        <p class="page-hero__kicker">EXCHANGE · 申请友链</p>
        <h2 class="link-apply__title">交换链接</h2>
        <span class="link-apply__glyph" aria-hidden="true">换</span>
      </header>
      <div class="link-apply__grid">
        <div class="link-apply__col">
          <h3 class="link-apply__sub" th:text="'本站信息'">本站信息</h3>
          <ul class="about-info">
            <li><span class="k">名称</span><span class="v" th:text="${site.title}"></span></li>
            <li><span class="k">链接</span><span class="v" th:text="${site.url}"></span></li>
            <li>
              <span class="k">描述</span
              ><span
                class="v"
                th:text="${#strings.isEmpty(theme.config.brand?.site_slogan) ? (site.subtitle ?: '') : theme.config.brand.site_slogan}"
              ></span>
            </li>
          </ul>
        </div>
        <div class="link-apply__col">
          <h3 class="link-apply__sub" th:text="'申请须知'">申请须知</h3>
          <ul class="apply-rules">
            <li>原创内容为主的独立阅读</li>
            <li>保持活跃，三个月内仍有更新</li>
            <li>无违法违规与 spam 内容</li>
            <li>请先添加本站链接，再通过留言板或邮件告知，通过后我会尽快回链</li>
          </ul>
        </div>
      </div>

      <th:block th:if="${linkApplicationEnabled}">
        <!-- Halo 的 param 对不存在的参数返回空集合而非 null，必须同时判空与判空集合，否则 [0] 会抛 EL1025E -->
        <th:block
          th:with="
            appliedState=${param.applied != null and not #lists.isEmpty(param.applied) ? param.applied[0] : ''},
            appliedMessage=${param.message != null and not #lists.isEmpty(param.message) ? param.message[0] : ''}"
        >
          <div
            class="link-apply__notice"
            th:if="${appliedState == 'success' or appliedState == 'error' or appliedState == 'disabled'}"
            th:classappend="${appliedState == 'success' ? 'is-success' : (appliedState == 'disabled' ? 'is-disabled' : 'is-error')}"
          >
            <b
              th:text="${appliedState == 'success' ? '申请已提交' : (appliedState == 'disabled' ? '暂未开放申请' : '提交失败')}"
              >申请已提交</b
            >
            <span
              th:text="${not #strings.isEmpty(appliedMessage) ? appliedMessage : (appliedState == 'success' ? '请等待站长审核，通过后会出现在友链列表中。' : '请检查填写内容后重新提交。')}"
            ></span>
          </div>
        </th:block>

        <form class="link-apply__form" th:action="@{/links/apply/submit}" method="post">
          <input type="hidden" name="_csrf" th:value="${csrfToken}" />
          <label>
            <span>站点名称</span>
            <input type="text" name="displayName" required maxlength="50" />
          </label>
          <label>
            <span>站点地址</span>
            <input type="url" name="url" required placeholder="https://" />
          </label>
          <label>
            <span>头像地址</span>
            <input type="url" name="logo" placeholder="https://" />
          </label>
          <label>
            <span>联系邮箱</span>
            <input type="email" name="email" required />
          </label>
          <label class="link-apply__full">
            <span>站点描述</span>
            <textarea name="description" rows="3" required maxlength="200"></textarea>
          </label>
          <label class="link-apply__full">
            <span>验证码</span>
            <span class="link-apply__captcha">
              <input type="text" name="captchaCode" required maxlength="8" autocomplete="off" />
              <img
                id="link-application-captcha"
                th:src="@{/links/apply/captcha}"
                alt="验证码"
                title="点击刷新验证码"
              />
            </span>
          </label>
          <div class="link-apply__actions">
            <button class="btn-primary" type="submit" th:text="'提交申请'">提交申请</button>
          </div>
        </form>
      </th:block>
    </section>
  </div>
</include>
