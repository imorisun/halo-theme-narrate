<include src="layout.html">
  <template name="head">
    <title th:text="|${#strings.defaultString(error.title, '页面未找到')} · ${site.title}|">
      出错了 · Narrate
    </title>
  </template>

  <div class="page-wrap container">
    <div class="error-page">
      <span class="error-page__code" aria-hidden="true">ERR</span>
      <h1 class="error-page__title" th:text="${#strings.defaultString(error.title, '页面未找到')}">
        页面未找到
      </h1>
      <p
        class="error-page__sub"
        th:if="${not #strings.isEmpty(error.detail)}"
        th:text="${error.detail}"
      ></p>
      <!-- 固定文案：错误页兜底说明 -->
      <p class="error-page__sub" th:if="${#strings.isEmpty(error.detail)}">
        你要找的内容可能已被移动或删除，也可能从未存在过。
      </p>
      <div class="error-page__actions">
        <a class="btn-primary" th:href="@{/}">返回首页</a>
        <a class="btn-ghost" th:href="@{${site.routes.archivesUri}}">浏览归档</a>
      </div>
    </div>
  </div>
</include>
