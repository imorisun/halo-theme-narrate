<include src="layout.html">
  <template name="head">
    <title th:text="|标签 · ${site.title}|">标签 · Narrate</title>
  </template>

  <section class="page-hero">
    <span class="page-hero__glyph" th:text="'签'">签</span>
    <div class="container">
      <div class="page-hero__kicker">TAGS · 标签</div>
      <h1 class="page-hero__title" th:text="'全部标签'">全部标签</h1>
      <p class="page-hero__sub" th:text="'关键词构成的索引，点击任意标签查看相关内容。'">
        关键词构成的索引，点击任意标签查看相关内容。
      </p>
    </div>
  </section>

  <div class="page-wrap container">
    <div class="link-stats">
      <span><b th:text="${tags.total}">0</b> 个标签</span>
      <i></i>
      <span th:text="|第 ${tags.page} / ${tags.totalPages} 页|">第 1 页</span>
    </div>

    <div class="tag-cloud tag-cloud--page" th:if="${not #lists.isEmpty(tags.items)}">
      <a th:each="tag : ${tags.items}" th:href="@{${tag.status.permalink}}"
        ><span th:text="${tag.spec.displayName}">标签</span><em th:text="${tag.postCount}">0</em></a
      >
    </div>

    <div class="ff-empty" th:if="${#lists.isEmpty(tags.items)}">
      <b>还没有标签</b>
      在 Halo Console 为文章添加标签后，这里会自动展示。
    </div>

    <nav class="page-navigator" th:if="${tags.hasPrevious() or tags.hasNext()}">
      <ul class="pagination">
        <li th:if="${tags.hasPrevious()}">
          <a th:href="@{${tags.prevUrl}}" aria-label="上一页">←</a>
        </li>
        <li class="current" th:text="${tags.page}">1</li>
        <li th:if="${tags.hasNext()}"><a th:href="@{${tags.nextUrl}}" aria-label="下一页">→</a></li>
      </ul>
    </nav>
  </div>
</include>
