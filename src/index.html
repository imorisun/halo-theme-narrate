<include src="layout.html">
  <template name="head">
    <title th:text="${site.title}">Narrate · 叙</title>
  </template>

  <section class="hero">
    <span class="hero__glyph" th:text="${theme.config.brand?.hero_glyph ?: '叙'}">叙</span>
    <div class="hero__inner container">
      <div class="hero__kicker">
        <span class="pulse"></span>
        <span th:text="${theme.config.brand?.hero_kicker ?: '叙 · 个人博客'}">叙 · 个人博客</span>
      </div>

      <!-- 主张句用 {rot} 标记旋转词位置；注意 #strings.arraySplit 基于 StringTokenizer（按字符集合切分），
           不能用来拆分 {rot}，否则 r/o/t/花括号都会被当成分隔符，故改用 indexOf + substring。
           SpEL 字符串字面量不支持 \n 转义，换行分隔符直接使用源码中的真实换行 -->
      <h1
        class="hero__statement"
        th:with="statement=${theme.config.brand?.hero_statement ?: '在喧嚣里，留一处{rot}。'},
                 rotAt=${#strings.indexOf(statement, '{rot}')},
                 rotRaw=${#strings.isEmpty(theme.config.brand?.hero_rot_words) ? '笔墨栖居地
思想避风港
文字小天地
心灵自留地' : theme.config.brand.hero_rot_words},
                 rotFlat=${#strings.replace(rotRaw, '，', '
')},
                 words=${#strings.replace(#strings.replace(rotFlat, ',', '
'), '、', '
')},
                 wordList=${#strings.arraySplit(words, '
')},
                 firstWord=${#strings.trim(wordList[0])}"
      >
        <span th:text="${rotAt >= 0 ? #strings.substring(statement, 0, rotAt) : statement}"
          >在喧嚣里，留一处</span
        ><span class="rot"
          ><span id="rotWord" th:attr="data-words=${words}" th:text="${firstWord}"
            >笔墨栖居地</span
          ></span
        ><span th:if="${rotAt >= 0}" th:text="${#strings.substring(statement, rotAt + 5)}">。</span>
      </h1>

      <p
        class="hero__intro"
        th:text="${#strings.isEmpty(theme.config.brand?.site_slogan) ? (site.subtitle ?: '一方文字自留地，记录生活、阅读与随想。') : theme.config.brand.site_slogan}"
      ></p>

      <div class="hero__meta">
        <div>
          <strong
            ><span th:attr="data-count=${posts.total}" th:text="${posts.total}">0</span
            ><em>篇</em></strong
          >
          文章
        </div>
        <div>
          <strong
            ><span
              th:attr="data-count=${#lists.size(categoryFinder.listAll())}"
              th:text="${#lists.size(categoryFinder.listAll())}"
              >0</span
            ><em>类</em></strong
          >
          分类
        </div>
        <div>
          <strong
            ><span
              th:attr="data-count=${#lists.size(tagFinder.listAll())}"
              th:text="${#lists.size(tagFinder.listAll())}"
              >0</span
            ><em>个</em></strong
          >
          标签
        </div>
      </div>

      <div class="hero__actions">
        <a class="btn-primary" href="#latest">
          <span th:text="${theme.config.home?.posts_anchor_text ?: '开始阅读'}">开始阅读</span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
        <a
          class="btn-ghost"
          th:href="@{${site.routes.archivesUri}}"
          th:text="${theme.config.home?.archives_text ?: '归档全部'}"
          >归档全部</a
        >
      </div>
    </div>
    <a class="hero__scroll" href="#latest" aria-label="向下滚动">Scroll</a>
  </section>

  <div class="statusbar">
    <div
      class="statusbar__inner container"
      th:attr="data-greetings=${theme.config.home?.greetings ?: '早安，新的一天。
午安，记得好好吃饭。
下午好，慢慢来。
夜色温柔，适合写字。
夜深了，写点什么吧。'}"
    >
      <div class="statusbar__cell">
        <span class="k">此刻</span>
        <span class="mono" id="nowTime">00:00:00</span>
      </div>
      <span class="statusbar__sep"></span>
      <div class="statusbar__cell">
        <span id="nowGreet">早安，新的一天。</span>
      </div>
      <span class="statusbar__sep"></span>
      <div class="statusbar__cell statusbar__latest" th:if="${not #lists.isEmpty(posts.items)}">
        <span class="k">最新</span>
        <a
          th:href="@{${posts.items[0].status.permalink}}"
          th:text="${posts.items[0].spec.title}"
        ></a>
      </div>
    </div>
  </div>

  <th:block th:if="${#lists.isEmpty(posts.items)}">
    <div class="container">
      <div class="ff-empty">
        <b>还没有文章</b>
        在 Halo Console 发布第一篇文章后，这里会自动出现内容。
      </div>
    </div>
  </th:block>

  <section class="spotlight container" id="latest" th:if="${not #lists.isEmpty(posts.items)}">
    <div class="spotlight__grid">
      <th:block th:each="post, iterStat : ${posts.items}" th:if="${iterStat.index == 0}">
        <th:block
          th:with="cat=${not #lists.isEmpty(post.categories) ? post.categories[0] : null},
                   cover=${not #strings.isEmpty(post.spec.cover) ? post.spec.cover : (theme.config.style?.default_cover ?: '')},
                   phClass=${'ph--' + #strings.arraySplit('a,b,c,d,e', ',')[iterStat.index % 5]}"
        >
          <a class="spotlight-main" th:href="@{${post.status.permalink}}">
            <div class="spotlight-main__cover">
              <img
                th:if="${not #strings.isEmpty(cover)}"
                th:src="${cover}"
                th:alt="${post.spec.title}"
              />
              <div th:if="${#strings.isEmpty(cover)}" class="ph" th:classappend="${phClass}">
                <span
                  class="ph__tag"
                  th:if="${cat != null}"
                  th:text="${cat.spec.displayName}"
                ></span>
                <span
                  class="ph__char"
                  th:text="${#strings.substring(post.spec.title, 0, 1)}"
                ></span>
              </div>
            </div>
            <div class="spotlight-main__body">
              <span
                class="spotlight-main__flag"
                th:if="${post.spec.pinned}"
                th:text="${theme.config.home?.featured_flag ?: '置顶精选'}"
                >置顶精选</span
              >
              <span class="tag" th:if="${cat != null}" th:text="${cat.spec.displayName}"></span>
              <h2 class="spotlight-main__title" th:text="${post.spec.title}"></h2>
              <p class="spotlight-main__excerpt" th:text="${post.status.excerpt}"></p>
              <div class="spotlight-main__meta">
                <time
                  th:datetime="${post.spec.publishTime}"
                  th:text="${#temporals.format(post.spec.publishTime, 'yyyy.MM.dd')}"
                ></time>
                <span th:if="${post.owner != null}" th:text="| · ${post.owner.displayName}|"></span>
              </div>
            </div>
          </a>
        </th:block>
      </th:block>

      <!-- 荐读榜单：排序方式与展示数量来自主题设置；留空时前端按阅读量降序排列。
           候选池取 30 篇，因为 Halo Finder 无法按 stats.visit（阅读量）做服务端排序 -->
      <th:block th:with="picksPool=${postFinder.list(1, 30).items}">
        <div
          class="rank"
          id="rankList"
          th:if="${#lists.size(picksPool) > 1}"
          th:attr="data-sort=${theme.config.home?.picks_sort ?: ''}, data-limit=${theme.config.home?.picks_limit ?: 4}"
        >
          <div class="rank__head">
            <h2 th:text="${theme.config.home?.picks_title ?: '编辑荐读'}">编辑荐读</h2>
            <span th:text="${theme.config.home?.picks_en ?: 'Editor’s Picks'}">Editor’s Picks</span>
          </div>
          <a
            class="rank-item"
            th:each="pick, pickStat : ${picksPool}"
            th:if="${pick.status.permalink != posts.items[0].status.permalink}"
            th:href="@{${pick.status.permalink}}"
            th:attr="data-views=${pick.stats?.visit ?: 0},
                     data-date=${#temporals.format(pick.spec.publishTime, 'yyyy-MM-dd''T''HH:mm:ss')},
                     hidden=${pickStat.index > (theme.config.home?.picks_limit ?: 4)}"
          >
            <span class="rank-item__no" aria-hidden="true"></span>
            <div class="rank-item__body">
              <div class="rank-item__title" th:text="${pick.spec.title}"></div>
              <div class="rank-item__meta">
                <time
                  th:datetime="${pick.spec.publishTime}"
                  th:text="${#temporals.format(pick.spec.publishTime, 'MM.dd')}"
                ></time>
                <span
                  th:if="${not #lists.isEmpty(pick.categories)}"
                  th:text="| · ${pick.categories[0].spec.displayName}|"
                ></span>
              </div>
            </div>
            <span class="rank-item__arrow">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </span>
          </a>
        </div>
      </th:block>
    </div>

    <nav class="page-navigator" th:if="${posts.hasPrevious() or posts.hasNext()}">
      <ul class="pagination">
        <li th:if="${posts.hasPrevious()}">
          <a th:href="@{${posts.prevUrl}}" aria-label="上一页">←</a>
        </li>
        <li class="current" th:text="${posts.page}">1</li>
        <li th:if="${posts.hasNext()}">
          <a th:href="@{${posts.nextUrl}}" aria-label="下一页">→</a>
        </li>
      </ul>
    </nav>
  </section>

  <!-- 瞬间：数据来自「瞬间」插件（PluginMoments），由主题设置中的开关控制显隐 -->
  <th:block
    th:if="${theme.config.home?.enable_moments != false and pluginFinder.available('PluginMoments')}"
  >
    <th:block th:with="moments=${momentFinder.list(1, theme.config.home?.moment_limit ?: 6)}">
      <section class="moments" th:if="${not #lists.isEmpty(moments.items)}">
        <div class="container">
          <div class="moments__head">
            <h2>
              <span th:text="${theme.config.home?.moments_title ?: '瞬间'}">瞬间</span>
              <em th:text="${theme.config.home?.moments_en ?: 'Moments'}">Moments</em>
            </h2>
            <p th:text="${theme.config.home?.moments_sub ?: '一些零碎的当下'}">一些零碎的当下</p>
            <div class="moments__nav">
              <button type="button" id="momPrev" aria-label="向左">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="m14 6-6 6 6 6" />
                </svg>
              </button>
              <button type="button" id="momNext" aria-label="向右">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="m10 6 6 6-6 6" />
                </svg>
              </button>
            </div>
          </div>

          <div class="moments__track">
            <article
              class="moment"
              th:each="moment : ${moments.items}"
              th:with="content=${moment.spec.content}"
            >
              <time
                class="moment-time"
                th:datetime="${moment.spec.releaseTime ?: moment.metadata.creationTimestamp}"
                data-relative
                th:text="${#temporals.format(moment.spec.releaseTime ?: moment.metadata.creationTimestamp, 'MM-dd')}"
              ></time>
              <div
                class="moment__text"
                th:if="${not #strings.isEmpty(content.html)}"
                th:utext="${content.html}"
              ></div>
              <div class="moment-grid g1" th:if="${not #lists.isEmpty(content.medium)}">
                <a
                  th:if="${content.medium[0].type.name == 'PHOTO' or content.medium[0].type.name == 'VIDEO'}"
                  th:href="@{/moments/{name}(name=${moment.metadata.name})}"
                >
                  <img
                    class="moment-img"
                    th:if="${content.medium[0].type.name == 'PHOTO'}"
                    th:src="${content.medium[0].url}"
                    th:alt="${theme.config.home?.moments_title ?: '瞬间'}"
                    loading="lazy"
                  />
                  <video
                    class="moment-img"
                    th:if="${content.medium[0].type.name == 'VIDEO'}"
                    th:src="${content.medium[0].url}"
                    controls
                    preload="metadata"
                  ></video>
                </a>
                <audio
                  th:if="${content.medium[0].type.name == 'AUDIO'}"
                  th:src="${content.medium[0].url}"
                  controls
                ></audio>
              </div>
              <div class="moment-footer">
                <span class="moment-loc">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z" />
                    <circle cx="12" cy="10" r="2.4" />
                  </svg>
                  <span th:text="${theme.config.home?.moments_title ?: '瞬间'}">瞬间</span>
                </span>
                <a th:href="@{/moments/{name}(name=${moment.metadata.name})}" th:text="'查看 →'"
                  >查看 →</a
                >
              </div>
            </article>
          </div>
        </div>
      </section>
    </th:block>
  </th:block>

  <!-- 排除分类：按回车拆行（同时兼容旧版英文逗号配置）。SpEL 字符串字面量不支持 \n 转义，
       分隔符使用源码中的真实换行；先剔除空格，避免缩进导致缩略名匹配失败 -->
  <th:block
    th:with="excludedRaw=${theme.config.home?.category_exclude_slugs ?: 'gallery'},
             excludedFlat=${#strings.replace(excludedRaw, ' ', '')},
             excluded=${#strings.arraySplit(excludedFlat, ',
')}"
  >
    <th:block th:each="cat, catStat : ${categoryFinder.listAll()}">
      <th:block th:if="${cat.postCount > 0 and not #arrays.contains(excluded, cat.spec.slug)}">
        <th:block th:with="catPosts=${postFinder.listByCategory(1, 4, cat.metadata.name)}">
          <section class="cat-section container" th:if="${not #lists.isEmpty(catPosts.items)}">
            <div class="cat-section__head">
              <span
                class="cat-section__no"
                th:text="${#numbers.formatInteger(catStat.index + 1, 2)}"
                >01</span
              >
              <h2 class="cat-section__name" th:text="${cat.spec.displayName}">分类</h2>
              <div class="cat-section__en" th:text="${#strings.toUpperCase(cat.spec.slug)}">
                CATEGORY
              </div>
              <p
                class="cat-section__desc"
                th:text="${not #strings.isEmpty(cat.spec.description) ? cat.spec.description : (theme.config.home?.cat_default_desc ?: '收录这一类下的文字。')}"
              ></p>
              <a class="cat-section__more" th:href="@{${cat.status.permalink}}">
                <span th:text="${theme.config.home?.cat_more_text ?: '查看全部'}">查看全部</span>
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </a>
            </div>
            <div class="cat-rows">
              <a
                class="cat-row"
                th:each="post : ${catPosts.items}"
                th:href="@{${post.status.permalink}}"
              >
                <span
                  class="cat-row__date"
                  th:text="${#temporals.format(post.spec.publishTime, 'MM.dd')}"
                  >01.01</span
                >
                <div class="cat-row__body">
                  <h3 class="cat-row__title" th:text="${post.spec.title}"></h3>
                  <div class="cat-row__meta">
                    <span th:text="${post.owner?.displayName ?: site.title}"></span>
                    <span
                      th:if="${theme.config.post?.show_views != false}"
                      th:text="| · ${post.stats?.visit ?: 0} 阅读|"
                    ></span>
                  </div>
                </div>
                <span class="cat-row__go">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M5 12h14M13 6l6 6-6 6" />
                  </svg>
                </span>
              </a>
            </div>
          </section>
        </th:block>
      </th:block>
    </th:block>
  </th:block>
</include>
