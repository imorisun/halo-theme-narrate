<include src="layout.html">
  <template name="head">
    <title th:text="${site.title}">Narrate · 叙</title>
  </template>

  <section class="hero">
    <span
      class="hero__glyph"
      th:text="${#strings.isEmpty(theme.config.brand?.hero_glyph) ? '叙' : theme.config.brand.hero_glyph}"
      >叙</span
    >
    <div class="hero__inner container">
      <div class="hero__kicker">
        <span class="pulse"></span>
        <span
          th:text="${#strings.isEmpty(theme.config.brand?.hero_kicker) ? '叙 · 个人博客' : theme.config.brand.hero_kicker}"
          >叙 · 个人博客</span
        >
      </div>

      <!-- 主张句用 {rot} 标记旋转词位置；注意 #strings.arraySplit 基于 StringTokenizer（按字符集合切分），
           不能用来拆分 {rot}，否则 r/o/t/花括号都会被当成分隔符，故改用 indexOf + substring -->
      <h1
        class="hero__statement"
        th:with="statement=${theme.config.brand?.hero_statement ?: '在喧嚣里，留一处{rot}。'},
                 rotAt=${#strings.indexOf(statement, '{rot}')},
                 rotRaw=${theme.config.brand?.hero_rot_words ?: '笔墨栖居地\n思想避风港\n文字小天地\n心灵自留地'},
                 rotFlat=${#strings.replace(#strings.replace(rotRaw, '\r', ''), '，', '\n')},
                 words=${#strings.replace(#strings.replace(rotFlat, ',', '\n'), '、', '\n')}"
      >
        <span th:text="${rotAt >= 0 ? #strings.substring(statement, 0, rotAt) : statement}"
          >在喧嚣里，留一处</span
        ><span class="rot"
          ><span
            id="rotWord"
            th:with="firstWord=${#strings.trim(#strings.arraySplit(words, '\n')[0])}"
            th:attr="data-words=${words}"
            th:text="${firstWord}"
            >笔墨栖居地</span
          ></span
        ><span th:if="${rotAt >= 0}" th:text="${#strings.substring(statement, rotAt + 5)}">。</span>
      </h1>

      <p
        class="hero__intro"
        th:text="${#strings.isEmpty(theme.config.brand?.site_slogan) ? (site.subtitle ?: '一方文字自留地，记录生活、阅读与随想。') : theme.config.brand.site_slogan}"
      ></p>

      <div class="hero__meta">
        <div>
          <strong
            ><span th:attr="data-count=${posts.total}" th:text="${posts.total}">0</span
            ><em>篇</em></strong
          >
          文章
        </div>
        <div>
          <strong
            ><span
              th:attr="data-count=${#lists.size(categoryFinder.listAll())}"
              th:text="${#lists.size(categoryFinder.listAll())}"
              >0</span
            ><em>类</em></strong
          >
          分类
        </div>
        <div>
          <strong
            ><span
              th:attr="data-count=${#lists.size(tagFinder.listAll())}"
              th:text="${#lists.size(tagFinder.listAll())}"
              >0</span
            ><em>个</em></strong
          >
          标签
        </div>
      </div>

      <div class="hero__actions">
        <a class="btn-primary" href="#latest">
          <span>开始阅读</span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
        <a class="btn-ghost" th:href="@{${site.routes.archivesUri}}">归档全部</a>
      </div>
    </div>
    <a class="hero__scroll" href="#latest" aria-label="向下滚动">Scroll</a>
  </section>

  <div class="statusbar">
    <div class="statusbar__inner container">
      <div class="statusbar__cell">
        <span class="now-label">此刻</span>
        <span class="now-time" id="nowTime">00:00:00</span>
      </div>
      <span class="statusbar__sep"></span>
      <div class="statusbar__cell">
        <!-- 问候语来自主题设置中以回车分隔的多行文本，由脚本按访客本地时间选择 -->
        <span
          class="now-greet"
          id="nowGreet"
          th:attr="data-greetings=${theme.config.home?.greetings}"
          >早安，新的一天。</span
        >
      </div>
      <span class="statusbar__sep"></span>
      <div class="statusbar__cell statusbar__latest" th:if="${not #lists.isEmpty(posts.items)}">
        <span class="now-label">最新</span>
        <!-- 单独按发布时间查询，避免沿用列表默认排序（置顶优先）而显示成置顶文章 -->
        <th:block
          th:with="latest=${postFinder.list({page: 1, size: 1, sort: {'spec.publishTime,desc'}})}"
        >
          <a
            th:if="${not #lists.isEmpty(latest.items)}"
            th:href="@{${latest.items[0].status.permalink}}"
            th:text="${latest.items[0].spec.title}"
          ></a>
        </th:block>
      </div>
    </div>
  </div>

  <th:block th:if="${#lists.isEmpty(posts.items)}">
    <div class="container">
      <div class="ff-empty">
        <b>还没有文章</b>
        在 Halo Console 发布第一篇文章后，这里会自动出现内容。
      </div>
    </div>
  </th:block>

  <section class="spotlight container" id="latest" th:if="${not #lists.isEmpty(posts.items)}">
    <div class="spotlight__grid">
      <th:block th:each="post, iterStat : ${posts.items}" th:if="${iterStat.index == 0}">
        <th:block
          th:with="cover=${post.spec.cover},
                   phClass=${'ph--' + #strings.arraySplit('a,b,c,d,e', ',')[iterStat.index % 5]}"
        >
          <a class="spotlight-main" th:href="@{${post.status.permalink}}">
            <div class="spotlight-main__cover">
              <img
                th:if="${not #strings.isEmpty(cover)}"
                th:src="${cover}"
                th:alt="${post.spec.title}"
              />
              <div th:if="${#strings.isEmpty(cover)}" class="ph" th:classappend="${phClass}">
                <span
                  class="ph__char"
                  th:text="${#strings.substring(post.spec.title, 0, 1)}"
                ></span>
              </div>
            </div>
            <!-- 角标固定在封面右上角；分类标签固定在左上角，样式沿用源主题的分类 pill -->
            <span class="spotlight-main__flag" th:if="${post.spec.pinned}">置顶精选</span>
            <!-- 多分类：封面左上角的分类标签内联展示全部分类 -->
            <span class="tag spotlight-main__cat" th:if="${not #lists.isEmpty(post.categories)}">
              <th:block th:each="cat, catStat : ${post.categories}">
                <span th:text="${cat.spec.displayName}"></span>
                <span class="cat-sep" th:if="${!catStat.last}" aria-hidden="true">·</span>
              </th:block>
            </span>
            <div class="spotlight-main__body">
              <h2 class="spotlight-main__title" th:text="${post.spec.title}"></h2>
              <p class="spotlight-main__excerpt" th:text="${post.status.excerpt}"></p>
              <div class="spotlight-main__meta">
                <time
                  th:datetime="${post.spec.publishTime}"
                  th:text="${#temporals.format(post.spec.publishTime, 'yyyy.MM.dd')}"
                ></time>
                <span th:if="${post.owner != null}" th:text="| · ${post.owner.displayName}|"></span>
              </div>
            </div>
          </a>
        </th:block>
      </th:block>

      <div class="rank" th:if="${#lists.size(posts.items) > 1}">
        <div class="rank__head">
          <h2>编辑荐读</h2>
          <span>Editor’s Picks</span>
        </div>
        <th:block
          th:each="post, iterStat : ${posts.items}"
          th:if="${iterStat.index > 0 and iterStat.index < 5}"
        >
          <a class="rank-item" th:href="@{${post.status.permalink}}">
            <span class="rank-item__no" th:text="${#numbers.formatInteger(iterStat.index + 1, 2)}"
              >02</span
            >
            <div class="rank-item__body">
              <div class="rank-item__title" th:text="${post.spec.title}"></div>
              <div class="rank-item__meta">
                <time
                  th:datetime="${post.spec.publishTime}"
                  th:text="${#temporals.format(post.spec.publishTime, 'MM.dd')}"
                ></time>
                <span class="post-cats-inline" th:if="${not #lists.isEmpty(post.categories)}">
                  <span class="cat-sep" aria-hidden="true">·</span>
                  <th:block th:each="cat, catStat : ${post.categories}">
                    <span th:text="${cat.spec.displayName}"></span>
                    <span class="cat-sep" th:if="${!catStat.last}" aria-hidden="true">·</span>
                  </th:block>
                </span>
              </div>
            </div>
            <span class="rank-item__arrow">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </span>
          </a>
        </th:block>
      </div>
    </div>
  </section>

  <!-- 瞬间：数据来自「瞬间」插件（PluginMoments），由主题设置中的开关控制显隐 -->
  <th:block
    th:if="${theme.config.home?.enable_moments != false and pluginFinder.available('PluginMoments')}"
  >
    <th:block th:with="moments=${momentFinder.list(1, theme.config.home?.moment_limit ?: 6)}">
      <section class="moments" th:if="${not #lists.isEmpty(moments.items)}">
        <div class="container">
          <div class="moments__head">
            <h2>
              <span>瞬间</span>
              <em>Moments</em>
            </h2>
            <p>一些零碎的当下</p>
            <div class="moments__nav">
              <button type="button" id="momPrev" aria-label="向左">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="m14 6-6 6 6 6" />
                </svg>
              </button>
              <button type="button" id="momNext" aria-label="向右">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="m10 6 6 6-6 6" />
                </svg>
              </button>
            </div>
          </div>

          <div class="moments__track">
            <article
              class="moment"
              th:each="moment : ${moments.items}"
              th:with="content=${moment.spec.content}"
            >
              <time
                class="moment-time"
                th:datetime="${moment.spec.releaseTime ?: moment.metadata.creationTimestamp}"
                data-relative
                th:text="${#temporals.format(moment.spec.releaseTime ?: moment.metadata.creationTimestamp, 'MM-dd')}"
              ></time>
              <div
                class="moment__text"
                th:if="${not #strings.isEmpty(content.html)}"
                th:utext="${content.html}"
              ></div>
              <div class="moment-grid g1" th:if="${not #lists.isEmpty(content.medium)}">
                <a
                  th:if="${content.medium[0].type.name == 'PHOTO' or content.medium[0].type.name == 'VIDEO'}"
                  th:href="@{/moments/{name}(name=${moment.metadata.name})}"
                >
                  <img
                    class="moment-img"
                    th:if="${content.medium[0].type.name == 'PHOTO'}"
                    th:src="${content.medium[0].url}"
                    th:alt="瞬间"
                    loading="lazy"
                  />
                  <video
                    class="moment-img"
                    th:if="${content.medium[0].type.name == 'VIDEO'}"
                    th:src="${content.medium[0].url}"
                    controls
                    preload="metadata"
                  ></video>
                </a>
                <audio
                  th:if="${content.medium[0].type.name == 'AUDIO'}"
                  th:src="${content.medium[0].url}"
                  controls
                ></audio>
              </div>
              <div class="moment-footer">
                <span class="moment-loc">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z" />
                    <circle cx="12" cy="10" r="2.4" />
                  </svg>
                  <span>瞬间</span>
                </span>
                <a th:href="@{/moments/{name}(name=${moment.metadata.name})}" th:text="'查看 →'"
                  >查看 →</a
                >
              </div>
            </article>

            <!-- 横滑末端的「查看全部」卡片：滚到最右侧时作为进入瞬间列表页的入口 -->
            <a class="moment moment--all" th:href="@{/moments}">
              <span class="moment--all__glyph" aria-hidden="true">瞬</span>
              <span class="moment--all__kicker">Moments · ALL</span>
              <span class="moment--all__foot">
                <span class="moment--all__label">查看全部瞬间</span>
                <span class="moment--all__arrow" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M5 12h14M13 6l6 6-6 6" />
                  </svg>
                </span>
              </span>
            </a>
          </div>
        </div>
      </section>
    </th:block>
  </th:block>

  <!-- 分类导览：只展示主题设置中勾选的分类，未选择时整块隐藏 -->
  <th:block th:with="pickedCategories=${theme.config.home?.categories}">
    <th:block th:if="${not #lists.isEmpty(pickedCategories)}">
      <th:block th:each="categoryName, catStat : ${pickedCategories}">
        <th:block th:with="cat=${categoryFinder.getByName(categoryName)}">
          <th:block th:if="${cat != null and cat.postCount > 0}">
            <th:block th:with="catPosts=${postFinder.listByCategory(1, 4, cat.metadata.name)}">
              <section class="cat-section container" th:if="${not #lists.isEmpty(catPosts.items)}">
                <div class="cat-section__head">
                  <span
                    class="cat-section__no"
                    th:text="${#numbers.formatInteger(catStat.count, 2)}"
                    >01</span
                  >
                  <h2 class="cat-section__name" th:text="${cat.spec.displayName}">分类</h2>
                  <div class="cat-section__en" th:text="${#strings.toUpperCase(cat.spec.slug)}">
                    CATEGORY
                  </div>
                  <p
                    class="cat-section__desc"
                    th:text="${not #strings.isEmpty(cat.spec.description) ? cat.spec.description : '收录这一类下的文字。'}"
                  ></p>
                  <a class="cat-section__more" th:href="@{${cat.status.permalink}}">
                    <span>查看全部</span>
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M5 12h14M13 6l6 6-6 6" />
                    </svg>
                  </a>
                </div>
                <div class="cat-rows">
                  <a
                    class="cat-row"
                    th:each="post : ${catPosts.items}"
                    th:href="@{${post.status.permalink}}"
                  >
                    <span
                      class="cat-row__date"
                      th:text="${#temporals.format(post.spec.publishTime, 'MM.dd')}"
                      >01.01</span
                    >
                    <div class="cat-row__body">
                      <h3 class="cat-row__title" th:text="${post.spec.title}"></h3>
                      <div class="cat-row__meta">
                        <span th:text="${post.owner?.displayName ?: site.title}"></span>
                        <span
                          th:if="${theme.config.post?.show_views != false}"
                          th:text="| · ${post.stats?.visit ?: 0} 阅读|"
                        ></span>
                      </div>
                    </div>
                    <span class="cat-row__go">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14M13 6l6 6-6 6" />
                      </svg>
                    </span>
                  </a>
                </div>
              </section>
            </th:block>
          </th:block>
        </th:block>
      </th:block>
    </th:block>
  </th:block>
</include>
